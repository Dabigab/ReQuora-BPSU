<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — ReQuora</title>
<meta name="description" content="Log in to ReQuora to report items and track your claims.">
<meta name="theme-color" content="#5e1020">
<link rel="icon" type="image/png" href="assets/bpsu-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">
<div id="site-header"></div>

<main class="auth-page">
  <div class="auth-split">
    <aside class="auth-brand" aria-hidden="false">
      <div class="auth-brand-inner">
        <img src="assets/bpsu-logo.png" alt="Bataan Peninsula State University seal" width="96" height="96">
        <h2>Welcome back to ReQuora</h2>
        <p>BPSU&rsquo;s digital lost &amp; found. Track your reports and claims in one place.</p>
        <ul class="auth-points">
          <li><span data-icon="search"></span> Search every lost and found report</li>
          <li><span data-icon="shield"></span> Verified in person by the office</li>
          <li><span data-icon="award"></span> Follow your claim until you recover it</li>
        </ul>
      </div>
    </aside>

    <section class="auth-panel">
      <div class="auth-card">
        <h1>Log in</h1>
        <p class="subtitle">Use the email you registered with.</p>
        <div class="form-msg" id="form-msg"></div>
        <form id="login-form" novalidate>
          <div class="form-field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required placeholder="you@bpsu.edu.ph" autocomplete="username" maxlength="120">
          </div>
          <div id="password-slot"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Log in</button>
        </form>
        <p class="form-footnote">Don&rsquo;t have an account? <a href="register.html" id="to-register">Sign up</a></p>
      </div>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/modals.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
