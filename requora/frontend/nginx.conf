server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Multi-page static site — just serve files as-is, falling back to a
    # friendly 404 page for anything that doesn't exist.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        access_log off;
    }
}
